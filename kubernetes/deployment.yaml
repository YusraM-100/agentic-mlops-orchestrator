apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: mlops-a3
  labels:
    app: inference-api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-api
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        app: inference-api
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: api
          image: mlops-a3-inference:1.0.0
          imagePullPolicy: IfNotPresent      # use the image built locally by Docker Desktop
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: inference-config
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: "100m", memory: "192Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
