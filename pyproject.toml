[project]
name = "assignment-03-mlops-agent"
version = "1.0.0"
description = "Production-ready MLOps AI agent (DVC, MLflow, Airflow 3, Kubernetes)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anthropic>=2.8,<3",
  "mlflow==3.15.2",
  "dvc==3.67.1",
  "kubernetes==37.0.2",
  "httpx==0.28.1",
  "pydantic>=2.9,<3",
  "python-dotenv==1.1.1",
  "pyyaml==6.0.3",
  "scikit-learn==1.8.0",
  "pandas==2.3.3",
  "joblib==1.5.2",
  "fastapi==0.118.0",
  "uvicorn==0.37.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["airflow", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
